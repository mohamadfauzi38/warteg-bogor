name: Deploy Warteg Bogor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Prepare public website files
        run: node .github/scripts/prepare-pages.mjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
